<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Quan quedem?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f0; color: #1a1a1a; min-height: 100vh;
    }
    .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 56px; }

    .header { text-align: center; margin-bottom: 26px; padding-top: 6px; }
    .header .icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    .header .sub { color: #666; margin-top: 5px; font-size: 14px; }

    .card {
      background: #fff; border-radius: 18px; padding: 20px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
    }
    .card-title { font-weight: 700; font-size: 15px; margin-bottom: 12px; }

    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #444; }
    input[type="text"] {
      width: 100%; padding: 13px 16px; border: 2px solid #e8e8e8; border-radius: 12px;
      font-size: 16px; outline: none; transition: border-color .18s; background: #fafafa; color: #111;
    }
    input:focus { border-color: #3d8b40; background: #fff; }
    input.err { border-color: #e53935; }

    .btn {
      display: block; width: 100%; padding: 15px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: transform .12s, opacity .12s; text-align: center; margin-bottom: 10px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: #3d8b40; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #357a38; }
    .btn-ghost {
      background: transparent; color: #3d8b40; font-size: 14px; padding: 12px;
      font-weight: 600; border: 1.5px solid #d4ebd5; border-radius: 12px;
    }

    /* Calendar */
    .cal-wrap { margin-bottom: 20px; }
    .cal-wrap:last-child { margin-bottom: 0; }
    .cal-title { font-weight: 700; font-size: 14px; text-align: center; text-transform: capitalize; margin-bottom: 10px; color: #333; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dn { text-align: center; font-size: 11px; font-weight: 700; color: #aaa; padding: 3px 0 6px; }
    .cal-d {
      aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; user-select: none;
      transition: background .12s, color .12s; -webkit-tap-highlight-color: transparent;
    }
    .cal-d.empty { pointer-events: none; }
    .cal-d.past { color: #ccc; pointer-events: none; }
    .cal-d.today { font-weight: 800; color: #3d8b40; }
    .cal-d.sel { background: #3d8b40; color: #fff !important; font-weight: 700; }
    .cal-d:not(.past):not(.sel):not(.empty):hover { background: #e8f5e9; }
    .cal-hint { text-align: center; font-size: 13px; color: #999; margin-top: 10px; min-height: 18px; }

    /* Date chips */
    .chip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .chip {
      padding: 16px 12px; border: 2px solid #e8e8e8; border-radius: 14px;
      cursor: pointer; transition: all .15s; text-align: center;
      user-select: none; -webkit-tap-highlight-color: transparent; background: #fafafa;
    }
    .chip:active { transform: scale(.97); }
    .chip.sel { border-color: #3d8b40; background: #e8f5e9; }
    .chip .wd { font-size: 12px; color: #aaa; text-transform: capitalize; margin-bottom: 2px; font-weight: 600; }
    .chip.sel .wd { color: #3d8b40; }
    .chip .dy { font-size: 26px; font-weight: 800; line-height: 1.1; color: #111; }
    .chip .mo { font-size: 12px; color: #aaa; text-transform: capitalize; margin-top: 2px; }
    .chip.sel .mo { color: #3d8b40; }

    /* Results */
    .res-row { margin-bottom: 16px; }
    .res-row:last-child { margin-bottom: 0; }
    .res-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    .res-label { font-weight: 600; font-size: 14px; text-transform: capitalize; }
    .res-score { font-size: 13px; color: #666; font-weight: 600; }
    .res-bg { height: 10px; background: #eee; border-radius: 6px; overflow: hidden; margin-bottom: 5px; }
    .res-bar { height: 100%; border-radius: 6px; transition: width .6s ease; }
    .res-names { font-size: 13px; color: #777; line-height: 1.4; }
    .res-empty { color: #ccc; font-style: italic; }

    /* Share */
    .share-box {
      display: flex; gap: 8px; align-items: center;
      background: #f5f6f5; border-radius: 12px; padding: 12px 14px; margin-top: 10px;
    }
    .share-url { flex: 1; font-size: 12px; word-break: break-all; color: #555; line-height: 1.4; }
    .copy-btn {
      flex-shrink: 0; padding: 8px 14px; border: none; border-radius: 9px;
      background: #3d8b40; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .copy-btn:hover { background: #357a38; }
    .copy-btn.ok { background: #555; }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { background: #e8f5e9; color: #2e7d32; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

    .loading { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
    .success-wrap { text-align: center; padding: 16px 0 28px; }
    .success-wrap .big { font-size: 52px; margin-bottom: 12px; }
    .success-wrap h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .success-wrap p { color: #666; margin-bottom: 20px; font-size: 15px; line-height: 1.5; }

    .desc { font-size: 14px; color: #777; margin-bottom: 14px; line-height: 1.5; }

    .small-btn {
      padding: 4px 10px; font-size: 12px; border: none; border-radius: 8px;
      background: #3d8b40; color: #fff; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>
<div class="app" id="app"><div class="loading">Carregant…</div></div>

<script>
// ── Storage: JSONBin.io v3 ────────────────────────────────
const JBIN    = 'https://api.jsonbin.io/v3/b';
const API_KEY = '$2a$10$Hny0sXHdP8z8u0N0tKqppeG2j0YdXskdiqcEyyxLTWFPjI9diRSNy';  // ← substitueix amb la teva Master Key

function getKey() { return API_KEY; }

async function createBin(data) {
  const r = await fetch(JBIN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': getKey(), 'X-Bin-Private': 'false' },
    body: JSON.stringify(data),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return j.metadata.id;
}

async function readBin(id) {
  const r = await fetch(`${JBIN}/${id}/latest`, {
    headers: { 'X-Master-Key': getKey() },
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return j.record;
}

async function updateBin(id, data) {
  const r = await fetch(`${JBIN}/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': getKey() },
    body: JSON.stringify(data),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Globals ──────────────────────────────────────────────
let _selDates = new Set();
let _months   = [];
let _respSel  = new Set();

const app = document.getElementById('app');
const LOC  = 'ca-ES';

// ── Utils ────────────────────────────────────────────────
const today = () => new Date().toISOString().slice(0,10);

function fmtLong(ds) {
  return new Date(ds+'T12:00:00').toLocaleDateString(LOC, {weekday:'long', day:'numeric', month:'long'});
}
function fmtChip(ds) {
  const d = new Date(ds+'T12:00:00');
  return {
    wd:    d.toLocaleDateString(LOC, {weekday:'short'}),
    day:   d.getDate(),
    month: d.toLocaleDateString(LOC, {month:'short'}),
  };
}
function baseUrl() {
  const u = window.location.href;
  return u.includes('?') ? u.slice(0, u.indexOf('?')) : u;
}
function copyText(text, btn) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .catch(() => {
      const ta = Object.assign(document.createElement('textarea'), {value: text});
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    })
    .finally(() => {
      btn.textContent = '✓ Copiat';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('ok'); }, 2200);
    });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Router ───────────────────────────────────────────────
// - Sense paràmetres → vista de creació (tu, el creador)
// - ?id=XXX          → vista de resposta (els amics)
// - ?id=XXX&v=r      → vista de resultats
function init() {
  const p  = new URLSearchParams(window.location.search);
  const id = p.get('id');
  if (!id)                      renderCreate();
  else if (p.get('v') === 'r') showResults(id);
  else                          showRespond(id);
}

// ── CREAR ────────────────────────────────────────────────
function renderCreate() {
  const now = new Date();
  _selDates = new Set();
  _months   = [now, new Date(now.getFullYear(), now.getMonth()+1, 1)];

  app.innerHTML = `
    <div class="header">
      <div class="icon">🧗</div>
      <h1>Quan quedem?</h1>
      <p class="sub">Tria els dies candidats i comparteix l'enllaç</p>
    </div>
    <div class="card">
      <label for="ename">Nom del pla</label>
      <input type="text" id="ename" placeholder="Ex: Escalada juny" maxlength="60" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-title">Quins dies proposes?</div>
      <p class="desc">Toca els dies per seleccionar-los.</p>
      <div id="cal"></div>
      <div class="cal-hint" id="hint">Toca els dies disponibles</div>
    </div>
    <button class="btn btn-primary" onclick="doCreate(this)">Generar enllaç per compartir →</button>
  `;
  renderCal();
}

function renderCal() {
  document.getElementById('cal').innerHTML = _months.map(renderCalMonth).join('');
  const n = _selDates.size, el = document.getElementById('hint');
  if (el) el.textContent = n === 0
    ? 'Toca els dies disponibles'
    : `${n} dia${n !== 1 ? 'es' : ''} seleccionat${n !== 1 ? 's' : ''}`;
}

function renderCalMonth(m) {
  const td = today(), y = m.getFullYear(), mo = m.getMonth();
  const title = m.toLocaleDateString(LOC, {month:'long', year:'numeric'});
  const first = (new Date(y, mo, 1).getDay() + 6) % 7;
  const dim   = new Date(y, mo+1, 0).getDate();
  const dns   = ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];
  let cells   = dns.map(n => `<div class="cal-dn">${n}</div>`).join('');
  for (let i = 0; i < first; i++) cells += `<div class="cal-d empty"></div>`;
  for (let d = 1; d <= dim; d++) {
    const ds  = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sel = _selDates.has(ds);
    const cls = ['cal-d', ds < td ? 'past' : '', ds === td && !sel ? 'today' : '', sel ? 'sel' : ''].filter(Boolean).join(' ');
    cells += `<div class="${cls}" onclick="toggleCal('${ds}')">${d}</div>`;
  }
  return `<div class="cal-wrap"><div class="cal-title">${title}</div><div class="cal-grid">${cells}</div></div>`;
}

function toggleCal(ds) {
  if (_selDates.has(ds)) _selDates.delete(ds); else _selDates.add(ds);
  renderCal();
}

async function doCreate(btn) {
  const nameEl = document.getElementById('ename');
  const name   = nameEl.value.trim();
  if (!name) { nameEl.classList.add('err'); nameEl.focus(); return; }
  nameEl.classList.remove('err');
  if (_selDates.size === 0) { alert('Tria almenys un dia.'); return; }

  btn.disabled = true; btn.textContent = 'Creant…';
  try {
    const session = { v:1, event:name, created:new Date().toISOString(), dates:[..._selDates].sort(), responses:[] };
    const id = await createBin(session);
    renderShare(id, name);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Generar enllaç per compartir →';
    alert('Error en crear la sessió. Comprova la connexió.');
    console.error(e);
  }
}

function renderShare(id, eventName) {
  const friendUrl = `${baseUrl()}?id=${id}`;
  const adminUrl  = `${baseUrl()}?id=${id}&v=r`;
  app.innerHTML = `
    <div class="header">
      <div class="icon">🎉</div>
      <h1>${esc(eventName)}</h1>
      <p class="sub">Llest! Comparteix l'enllaç amb els teus amics</p>
    </div>
    <div class="card">
      <div class="card-title">Enllaç per als amics</div>
      <p class="desc">Entren, marquen els seus dies i llest. Sense registre.</p>
      <div class="share-box">
        <span class="share-url">${esc(friendUrl)}</span>
        <button class="copy-btn" onclick="copyText(${JSON.stringify(friendUrl)},this)">Copiar</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">El teu enllaç de resultats</div>
      <p class="desc">Mostra qui pot quin dia, en temps real.</p>
      <div class="share-box">
        <span class="share-url">${esc(adminUrl)}</span>
        <button class="copy-btn" onclick="copyText(${JSON.stringify(adminUrl)},this)">Copiar</button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="showResults('${id}')">Veure resultats →</button>
    <button class="btn btn-ghost" onclick="renderCreate()">← Crear una altra sessió</button>
  `;
}

// ── RESPONDRE ────────────────────────────────────────────
async function showRespond(id) {
  app.innerHTML = `<div class="loading">Carregant…</div>`;
  try {
    const s = await readBin(id);
    renderRespond(id, s);
  } catch(e) {
    app.innerHTML = `<div style="text-align:center;padding:40px;color:#c62828">⚠️<br><br>No s'ha trobat la sessió.<br>Comprova l'enllaç.</div>`;
  }
}

function renderRespond(id, s) {
  _respSel = new Set();
  const total = s.responses.length;
  const chips = s.dates.map((ds, i) => {
    const f = fmtChip(ds);
    return `<div class="chip" onclick="toggleChip(this,${i})">
      <div class="wd">${f.wd}</div><div class="dy">${f.day}</div><div class="mo">${f.month}</div>
    </div>`;
  }).join('');

  const subtitle = total === 0 ? 'Sigues el primer en respondre'
    : `${total} persona${total !== 1 ? 'es' : ''} ${total !== 1 ? 'han' : 'ha'} respost`;

  app.innerHTML = `
    <div class="header">
      <div class="icon">🧗</div>
      <h1>${esc(s.event)}</h1>
      <p class="sub">${subtitle}</p>
    </div>
    <div class="card">
      <label for="pname">Com et dius?</label>
      <input type="text" id="pname" placeholder="El teu nom" maxlength="40" autocomplete="given-name">
    </div>
    <div class="card">
      <div class="card-title">Quins dies pots?</div>
      <p class="desc">Toca els dies en què estàs lliure.</p>
      <div class="chip-grid">${chips}</div>
    </div>
    <button class="btn btn-primary" onclick="doSubmit('${id}',this)">Enviar disponibilitat →</button>
    <button class="btn btn-ghost" onclick="showResults('${id}')">Veure resultats sense respondre</button>
  `;
}

function toggleChip(el, i) {
  if (_respSel.has(i)) { _respSel.delete(i); el.classList.remove('sel'); }
  else { _respSel.add(i); el.classList.add('sel'); }
}

async function doSubmit(id, btn) {
  const nameEl = document.getElementById('pname');
  const name   = nameEl.value.trim();
  if (!name) { nameEl.classList.add('err'); nameEl.focus(); return; }

  btn.disabled = true; btn.textContent = 'Enviant…';
  try {
    const latest = await readBin(id);
    latest.responses = latest.responses.filter(r => r.name.toLowerCase() !== name.toLowerCase());
    latest.responses.push({ name, dates: [..._respSel].map(i => latest.dates[i]).sort(), ts: new Date().toISOString() });
    await updateBin(id, latest);
    renderSuccess(id, latest.event);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Enviar disponibilitat →';
    alert('Error en enviar. Torna-ho a intentar.');
    console.error(e);
  }
}

function renderSuccess(id, eventName) {
  app.innerHTML = `
    <div class="success-wrap">
      <div class="big">✅</div>
      <h2>Enviat!</h2>
      <p>La teva disponibilitat per a <strong>${esc(eventName)}</strong> ha quedat guardada.</p>
      <button class="btn btn-primary" style="max-width:280px;margin:0 auto" onclick="showResults('${id}')">Veure resultats →</button>
    </div>
  `;
}

// ── RESULTATS ────────────────────────────────────────────
async function showResults(id) {
  app.innerHTML = `<div class="loading">Carregant resultats…</div>`;
  try {
    const s = await readBin(id);
    renderResults(id, s);
  } catch(e) {
    app.innerHTML = `<div style="text-align:center;padding:40px;color:#c62828">⚠️<br><br>Error carregant els resultats.</div>`;
  }
}

function renderResults(id, s) {
  const total = s.responses.length;
  const maxN  = total || 1;
  const counts = {};
  s.dates.forEach(d => { counts[d] = {n:0, names:[]}; });
  s.responses.forEach(r => {
    r.dates.forEach(d => { if (counts[d]) { counts[d].n++; counts[d].names.push(r.name); } });
  });
  const sorted = [...s.dates].sort((a,b) => counts[b].n - counts[a].n);

  const rows = sorted.map(d => {
    const {n, names} = counts[d];
    const pct = Math.round((n / maxN) * 100);
    const col = n === 0 ? '#e0e0e0' : pct < 35 ? '#a5d6a7' : pct < 65 ? '#4caf50' : '#2e7d32';
    const nHtml = names.length
      ? `<div class="res-names">${names.map(esc).join(', ')}</div>`
      : `<div class="res-names res-empty">Ningú de moment</div>`;
    return `<div class="res-row">
      <div class="res-hdr"><span class="res-label">${esc(fmtLong(d))}</span><span class="res-score">${n}/${total}</span></div>
      <div class="res-bg"><div class="res-bar" style="width:${pct}%;background:${col}"></div></div>
      ${nHtml}
    </div>`;
  }).join('');

  const subtitle = total === 0 ? 'Encara no hi ha respostes'
    : `${total} persona${total !== 1 ? 'es' : ''} ${total !== 1 ? 'han' : 'ha'} respost`;

  const respHtml = total > 0
    ? `<div class="card"><div class="card-title">Han respost (${total})</div>
       <div class="tags">${s.responses.map(r => `<span class="tag">${esc(r.name)}</span>`).join('')}</div></div>`
    : '';

  const friendUrl = `${baseUrl()}?id=${id}`;
  app.innerHTML = `
    <div class="header">
      <div class="icon">📊</div>
      <h1>${esc(s.event)}</h1>
      <p class="sub">${subtitle}
        &nbsp;·&nbsp;<button class="small-btn" onclick="showResults('${id}')">↺ Actualitzar</button></p>
    </div>
    <div class="card">${rows || '<p style="color:#aaa;text-align:center;padding:20px 0">Sense respostes encara</p>'}</div>
    ${respHtml}
    <div class="card">
      <div class="card-title">Enllaç per compartir</div>
      <div class="share-box">
        <span class="share-url">${esc(friendUrl)}</span>
        <button class="copy-btn" onclick="copyText(${JSON.stringify(friendUrl)},this)">Copiar</button>
      </div>
    </div>
    <button class="btn btn-ghost" onclick="showRespond('${id}')">← Canviar la meva disponibilitat</button>
  `;
}

// ── Arrancar ─────────────────────────────────────────────
init();
</script>
</body>
</html>
